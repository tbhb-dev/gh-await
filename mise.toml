#:schema https://mise.jdx.dev/schema/mise.json
# The repo-specific half of the task and toolchain definitions. The shared
# half arrives through vendir: tool pins in .config/mise/conf.d/, tasks
# under .devtools/tasks/ selected by the task_config includes below.

[settings]
lockfile = true
# Tool versions come from mise.toml and conf.d alone; stop mise from reading
# idiomatic version files such as .node-version.
idiomatic_version_file_enable_tools = []

[tools]
# vendir can't come from the payload it delivers: bootstrap syncs before it installs.
vendir = "0.46.1"
apm = "0.33.0"
shfmt = "3.14.1"
jq = "1.8.2"
# guard-markdown backs lint-markdown-wrap and the Claude write hook.
# devtools:update-pins moves this pin with the others, and
# devtools:check-pins holds it to the same release.
"go:github.com/tbhb-dev/devtools/cmd/guard-markdown" = "v0.12.0"

[env]
DEVTOOLS_LOCK_PLATFORMS = "linux-x64,macos-arm64"
DEVTOOLS_GO_MODULES_MODE = "vendor"

[task_config]
includes = [
  ".devtools/tasks/apm.toml",
  ".devtools/tasks/fix.toml",
  ".devtools/tasks/format.toml",
  ".devtools/tasks/git-hooks.toml",
  ".devtools/tasks/go.toml",
  ".devtools/tasks/leaks.toml",
  ".devtools/tasks/lint.toml",
  ".devtools/tasks/pins.toml",
  ".devtools/tasks/preapproval.toml",
  ".devtools/tasks/security.toml",
  ".devtools/tasks/toolchain.toml",
  ".devtools/tasks/vendir.toml",
]

[tasks.bootstrap]
description = "Sync the vendored payload, install the toolchain, and install git hooks"
alias = "setup"
run = [
  "vendir sync",
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run devtools:prek-install",
  "mise run install-pre-push",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and the vendored conf.d"
run = "mise install"

[tasks.install-tools]
description = "Download the Vale style packages .vale.ini names"
run = "vale sync"

# The payload's drift gate. It resyncs in place and compares against the git
# index, so it fails on a tree whose payload is not yet staged.
[tasks.check-vendored]
description = "Fail when the vendored payload differs from what vendir.lock.yml pins"
run = "mise run devtools:check-vendored"

# The leak gate is the payload's check-leaks.sh. The unprefixed name is the
# one the pre-commit hooks and the lint aggregate call. Private literals come
# from GH_AWAIT_PRIVATE_STRINGS in the gitignored mise.local.toml. Arguments
# pass through to the script: `mise run lint-leaks -- --staged`. With none it
# scans the working tree. quiet keeps mise from echoing the arguments, which
# can be private filenames.
[tasks.lint-leaks]
description = "Fail when a file carries a private value or a private-network or credential pattern"
quiet = true
run = "bash $DEVTOOLS_DIR/scripts/check-leaks.sh"

[tasks.install-pre-push]
description = "Put the leak check in front of prek's pre-push hook"
run = "bash $DEVTOOLS_DIR/scripts/install-pre-push.sh"

[tasks.lint-hooks]
description = "Fail locally when the leak-check pre-push hook isn't installed"
run = "mise run devtools:check-leak-hook"

# The bare devtools pin plus `target: [claude, codex]` is assumed to
# deploy the claude, common, and codex packages and nothing for
# antigravity (D13). This holds that assumption to the recorded deploy.
[tasks.lint-apm-deploy]
description = "Fail when the deployed APM primitives differ from the recorded frozen-consumer set"
run = "bash tools/check-apm-deploy.sh"

[tasks.lint-commit-msg]
extends = "devtools:lint-commit-msg"

[tasks.lint-squash-msg]
extends = "devtools:lint-squash-msg"

# The pull request counterpart the pr skill calls. Body adapted from
# devtools/mise.toml [tasks.lint-pr-description] with a leak scan added;
# validate-description.sh exists once apm install has deployed the pr skill.
[tasks.lint-pr-description]
extends = "devtools:lint-pr-description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=ai-tells-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress PR_AGENTDESC.md",
  "bash $DEVTOOLS_DIR/scripts/check-leaks.sh PR_AGENTDESC.md",
]

# The draft and replacement tasks the fix-prose skills call by name. Both
# take their bodies from the payload's skill-contract templates.
[tasks.lint-draft]
extends = "devtools:lint-draft"

[tasks.fix-prose-replacements]
extends = "devtools:fix-prose-replacements"

# The payload's file selection already drops the vendored, deployed, and
# gitignored trees. The glob drops the rest this repo's prose rules
# shouldn't judge: the license text, the Vale styles, and the vendored
# payload, which answers to upstream's prose.
[tasks.lint-prose]
extends = "devtools:lint-prose"
env = { DEVTOOLS_PROSE_GLOB = "!{LICENSE,.vale/*,.devtools/**}" }

[tasks.lint]
extends = "devtools:lint"
run = [
  "mise run check-vendored",
  "mise run lint-leaks",
  "mise run lint-hooks",
  "mise run devtools:check-pins",
  "mise run devtools:check-toolchain",
  "mise run devtools:lint-apm",
  "mise run lint-apm-deploy",
  "mise run lint-prose",
  "mise run devtools:lint-spelling",
  "mise run devtools:lint-markdown",
  "mise run devtools:lint-markdown-wrap",
  "mise run devtools:lint-config",
  "mise run devtools:lint-yaml",
  "mise run devtools:lint-toml",
  "mise run devtools:lint-mise",
  "mise run devtools:lint-workflows",
  "mise run devtools:lint-shell",
  "mise run devtools:lint-shell-fmt",
  "mise run devtools:lint-curl",
  "mise run lint-go-all",
  "mise run lint-go-fmt",
]

[tasks.test-leaks]
description = "Test the payload's leak check"
run = "bats .devtools/scripts/check-leaks.bats"

[tasks.test]
description = "Run every test suite"
run = ["mise run test-leaks", "mise run test-go", "mise run cover-go"]

[tasks.check]
description = "Fast quality bar: lint then test"
run = ["mise run lint", "mise run test"]

[tasks.check-all]
description = "Deeper bar: check plus the full-history gitleaks scan and the dependency and reachable-vulnerability scans"
run = [
  "mise run check",
  "mise run devtools:gitleaks",
  "mise run devtools:gomodscan",
  "mise run devtools:vuln",
]

# The v0.11.0 payload lacks run, clean, and lint-go-fmt (#157).
[tasks.run]
description = "Run one binary by name, e.g. mise run run gh-await version"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bin=$1
shift
go run -ldflags "$(bash "$DEVTOOLS_DIR/scripts/go-ldflags.sh")" "./cmd/$bin" "$@"
'''

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf bin dist coverage.out coverage.html coverage.txt coverage.xml coverage.covdata*"

[tasks.lint-go-fmt]
description = "Fail if golangci-lint's formatters would change any Go file"
run = "golangci-lint fmt --diff ./cmd/... ./internal/..."

# Local workaround for tbhb-dev/devtools#182: detect untracked vendor files.
# Capture them before regeneration too, since go mod vendor removes stray files.
[tasks.vendor-check]
description = "Check that vendor/, go.mod, and go.sum are in sync"
run = '''
#!/usr/bin/env bash
set -euo pipefail
untracked_before=$(git ls-files --others --exclude-per-directory=.gitignore -- go.mod go.sum vendor/)
go mod tidy
go mod vendor
untracked_after=$(git ls-files --others --exclude-per-directory=.gitignore -- go.mod go.sum vendor/)
if [[ -n $untracked_before || -n $untracked_after ]] || ! git diff --exit-code -- go.mod go.sum vendor/; then
  printf '%s\n' "$untracked_before" "$untracked_after" | sort -u >&2
  echo "vendor drift detected; run 'mise run vendor' and commit" >&2
  exit 1
fi
'''

# Unprefixed names that CI, the lint and test aggregates, and the docs call.
# Every other Go task runs by its devtools: name, as devtools' own workflows do.
[tasks.build]
description = "Run devtools:build"
run = "mise run devtools:build"

[tasks.lint-go-all]
description = "Run devtools:lint-go-all"
run = "mise run devtools:lint-go-all"

[tasks.lint-go-arch]
description = "Run devtools:lint-go-arch"
run = "mise run devtools:lint-go-arch"

[tasks.lint-go-deadcode]
description = "Run devtools:lint-go-deadcode"
run = "mise run devtools:lint-go-deadcode"

[tasks.test-go]
description = "Run devtools:test-go"
run = "mise run devtools:test-go"

[tasks.test-go-race]
description = "Run devtools:test-go-race"
run = "mise run devtools:test-go-race"

[tasks.cover-go]
description = "Run devtools:cover-go"
run = "mise run devtools:cover-go"

[tasks.cover-go-check]
description = "Run devtools:cover-go-check"
run = "mise run devtools:cover-go-check"

[tasks.vuln]
description = "Run devtools:vuln"
run = "mise run devtools:vuln"

[tasks.vendor]
description = "Run devtools:vendor"
run = "mise run devtools:vendor"
